# Dry-run evidence collection for H-103 (AbnormalDayContinuationRVol_H103_v1), written by the autopilot policy
# (lab/autopilot.py, lab/config/autopilot.json) on the pairs whose single validation read was a candidate:
# ETH/USDT, BTC/USDT. Exposure 0.1 is the one calibrated on exploration. Same rules as
# docker-compose.forward.yml: base config first, the overlay changes only bot name, strategy, database,
# exposure and pair. No API server, no exchange keys, no real money.
# Check the freeze first:  python research/tools/forward_freeze.py H-103 --check
name: trading-lab-forward-h103

services:
  forward-h103-eth:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h103-eth
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h103.eth.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h103-eth.log
  forward-h103-btc:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h103-btc
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h103.btc.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h103-btc.log

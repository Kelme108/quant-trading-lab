# Dry-run evidence collection for H-101 (HourlyIchimokuTrendRVol_H101_v1), written by the autopilot policy
# (lab/autopilot.py, lab/config/autopilot.json) on the pairs whose single validation read was a candidate:
# LTC/USDT, LINK/USDT, ETH/USDT, ADA/USDT. Exposure 0.3 is the one calibrated on exploration. ONE bot for all 4 pairs
# (layout multi_pair, lab/forward.py): max_open_trades 4 and a 4000 USDT paper wallet,
# so each pair trades 1000 x 0.3 per trade, as in its one-pair backtest. Base config
# first, the overlay changes only bot name, strategy, database, slots, wallet, exposure and pairs.
# No API server, no exchange keys, no real money.
# Check the freeze first:  python research/tools/forward_freeze.py H-101 --check
name: trading-lab-forward-h101

services:
  forward-h101:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h101
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h101.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h101.log

# Dry-run evidence collection for H-101 (HourlyIchimokuTrendRVol_H101_v1), written by the autopilot policy
# (lab/autopilot.py, lab/config/autopilot.json) on the pairs whose single validation read was a candidate:
# LTC/USDT, LINK/USDT. Exposure 0.3 is the one calibrated on exploration. Same rules as
# docker-compose.forward.yml: base config first, the overlay changes only bot name, strategy, database,
# exposure and pair. No API server, no exchange keys, no real money.
# Check the freeze first:  python research/tools/forward_freeze.py H-101 --check
name: trading-lab-forward-h101

services:
  forward-h101-ltc:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h101-ltc
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h101.ltc.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h101-ltc.log
  forward-h101-link:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h101-link
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h101.link.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h101-link.log

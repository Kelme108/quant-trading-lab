# Dry-run evidence collection for H-104 (HourlyWilliamsVolBreakoutRVol_H104_v1), written by the autopilot policy
# (lab/autopilot.py, lab/config/autopilot.json) on the pairs whose single validation read was a candidate:
# BNB/USDT, ETH/USDT. Exposure 0.25 is the one calibrated on exploration. Same rules as
# docker-compose.forward.yml: base config first, the overlay changes only bot name, strategy, database,
# exposure and pair. No API server, no exchange keys, no real money.
# Check the freeze first:  python research/tools/forward_freeze.py H-104 --check
name: trading-lab-forward-h104

services:
  forward-h104-bnb:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h104-bnb
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h104.bnb.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h104-bnb.log
  forward-h104-eth:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h104-eth
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h104.eth.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h104-eth.log

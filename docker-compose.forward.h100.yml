# Dry-run evidence collection for H-100 (RSIOverboughtMomentumRVol_H100_v1), written by the autopilot policy
# (lab/autopilot.py, lab/config/autopilot.json) on the pairs whose single validation read was a candidate:
# ETH/USDT, BNB/USDT, LINK/USDT, SOL/USDT. Exposure 0.2 is the one calibrated on exploration. ONE bot for all 4 pairs
# (layout multi_pair, lab/forward.py): max_open_trades 4 and a 4000 USDT paper wallet,
# so each pair trades 1000 x 0.2 per trade, as in its one-pair backtest. Base config
# first, the overlay changes only bot name, strategy, database, slots, wallet, exposure and pairs.
# No API server, no exchange keys, no real money.
# Check the freeze first:  python research/tools/forward_freeze.py H-100 --check
name: trading-lab-forward-h100

services:
  forward-h100:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: forward-h100
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./forward:/freqtrade/forward:ro"
    command: >-
      trade --config /freqtrade/user_data/config.dryrun.json --config /freqtrade/forward/config.h100.json
      --strategy-path /freqtrade/user_data/strategies --logfile /freqtrade/user_data/logs/forward-h100.log

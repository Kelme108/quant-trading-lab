# Testes automáticos. A primeira execução no GitHub ainda não aconteceu (2026-11-20): se algo falhar por diferença de
# sistema ou de dado local, corrija o teste ou documente; não afrouxe o que protege segredos e gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Cofre de notas, linha B3 e motor ao vivo
        run: python -m pytest tests/test_cerebro_vault.py tests/b3 tests/live -q
